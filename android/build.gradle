buildscript {
    ext.kotlin_version = '2.2.20'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}



rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android {
            if (namespace == null) {
            namespace project.group
                   }
                }
            }
        }
    }


subprojects {
    project.evaluationDependsOn(":app")
}

subprojects {
    project.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        kotlinOptions {
            jvmTarget = "17"
        }
    }

    def configureAndroid = {
        if (project.extensions.findByName("android") != null) {
            project.android {
                // Old plugins (e.g. share_whatsapp) still compile against android-31,
                // which current AndroidX AAR metadata rejects.
                def pluginCompileSdk = compileSdkVersion?.replace("android-", "")
                if (pluginCompileSdk?.isInteger() && pluginCompileSdk.toInteger() < 36) {
                    compileSdkVersion 36
                }
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
            }
        }
    }

    if (project.state.executed) {
        configureAndroid()
    } else {
        project.afterEvaluate { configureAndroid() }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}


